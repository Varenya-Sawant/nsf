# =============================================================================
# ci.yml — Continuous Integration pipeline for nsf
# Runs on every push and every pull request.
# Three jobs run in parallel: shellcheck lint, tests on Ubuntu, tests on macOS.
# A PR must pass ALL three before it can be merged.
# =============================================================================

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: shellcheck — static analysis on all bash files
  # ---------------------------------------------------------------------------
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on all shell files
        run: |
          shellcheck -x bin/nsf
          shellcheck -x lib/constants.sh
          shellcheck -x lib/logger.sh
          shellcheck -x lib/utils.sh
          shellcheck -x lib/templates.sh
          shellcheck -x lib/core.sh
          shellcheck -x install.sh
          shellcheck -x uninstall.sh
          shellcheck -x completions/nsf.bash
          shellcheck -x tests/test_nsf.sh

  # ---------------------------------------------------------------------------
  # Job 2: test on Ubuntu (primary platform)
  # ---------------------------------------------------------------------------
  test-ubuntu:
    name: Tests (Ubuntu)
    runs-on: ubuntu-latest
    needs: shellcheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Bash version
        run: bash --version

      - name: Make scripts executable
        run: chmod +x bin/nsf install.sh uninstall.sh tests/test_nsf.sh

      - name: Copy files to install location manually
        run: |
          mkdir -p ~/.local/bin
          mkdir -p ~/.local/lib/nsf
          cp -r lib       ~/.local/lib/nsf/
          cp -r templates ~/.local/lib/nsf/
          cp bin/nsf      ~/.local/bin/nsf
          chmod +x        ~/.local/bin/nsf

      - name: Smoke test — version and help exit cleanly
        run: |
          bash ~/.local/bin/nsf --version
          bash ~/.local/bin/nsf --help
          bash ~/.local/bin/nsf --list

      - name: Run full test suite
        env:
          NSF_INSTALL_DIR: /home/runner/.local/lib/nsf
        run: bash tests/test_nsf.sh

  # ---------------------------------------------------------------------------
  # Job 3: test on macOS
  # ---------------------------------------------------------------------------
  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    needs: shellcheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bash 4+ via Homebrew
        run: brew install bash

      - name: Make scripts executable
        run: chmod +x bin/nsf install.sh uninstall.sh tests/test_nsf.sh

      - name: Copy files to install location manually
        run: |
          mkdir -p ~/.local/bin
          mkdir -p ~/.local/lib/nsf
          cp -r lib       ~/.local/lib/nsf/
          cp -r templates ~/.local/lib/nsf/
          cp bin/nsf      ~/.local/bin/nsf
          chmod +x        ~/.local/bin/nsf

      - name: Smoke tests
        run: |
          /opt/homebrew/bin/bash ~/.local/bin/nsf --version
          /opt/homebrew/bin/bash ~/.local/bin/nsf --help
          /opt/homebrew/bin/bash ~/.local/bin/nsf --list

      - name: Run full test suite
        env:
          NSF_INSTALL_DIR: /Users/runner/.local/lib/nsf
        run: /opt/homebrew/bin/bash tests/test_nsf.sh

  # ---------------------------------------------------------------------------
  # Job 4: changelog check
  # ---------------------------------------------------------------------------
  changelog:
    name: Changelog updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG updated when code changes
        run: |
          changed_code=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^(bin/|lib/|templates/)' || true)

          if [[ -n "${changed_code}" ]]; then
            changed_changelog=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep 'CHANGELOG.md' || true)

            if [[ -z "${changed_changelog}" ]]; then
              echo "Code files changed but CHANGELOG.md was not updated."
              echo "Changed files:"
              echo "${changed_code}"
              echo ""
              echo "Please add an entry to CHANGELOG.md under [Unreleased]."
              exit 1
            fi
          fi
