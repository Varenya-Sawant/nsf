name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on all shell files
        run: |
          shellcheck -x bin/nsf
          shellcheck -x lib/constants.sh
          shellcheck -x lib/logger.sh
          shellcheck -x lib/utils.sh
          shellcheck -x lib/templates.sh
          shellcheck -x lib/core.sh
          shellcheck -x install.sh
          shellcheck -x uninstall.sh
          shellcheck -x completions/nsf.bash
          shellcheck -x tests/test_nsf.sh

  test-ubuntu:
    name: Tests (Ubuntu)
    runs-on: ubuntu-latest
    needs: shellcheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Bash version
        run: bash --version

      - name: Make scripts executable
        run: chmod +x bin/nsf install.sh uninstall.sh tests/test_nsf.sh

      - name: Set up nsf directory structure
        run: |
          mkdir -p "$HOME/.local/bin"
          mkdir -p "$HOME/.local/lib"
          mkdir -p "$HOME/.local/templates"
          cp -r lib/       "$HOME/.local/lib/"
          cp -r templates/ "$HOME/.local/templates/"
          cp bin/nsf       "$HOME/.local/bin/nsf"
          chmod +x         "$HOME/.local/bin/nsf"
          echo "=== what got copied ==="
          find "$HOME/.local" -type f | sort

      - name: Smoke test
        run: |
          export NSF_INSTALL_DIR="$HOME/.local"
          bash "$HOME/.local/bin/nsf" --version
          bash "$HOME/.local/bin/nsf" --help
          bash "$HOME/.local/bin/nsf" --list

      - name: Run full test suite
        run: |
          export NSF_INSTALL_DIR="$HOME/.local"
          bash tests/test_nsf.sh

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    needs: shellcheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bash 4+ via Homebrew
        run: brew install bash

      - name: Make scripts executable
        run: chmod +x bin/nsf install.sh uninstall.sh tests/test_nsf.sh

      - name: Set up nsf directory structure
        run: |
          mkdir -p "$HOME/.local/bin"
          mkdir -p "$HOME/.local/lib"
          mkdir -p "$HOME/.local/templates"
          cp -r lib/       "$HOME/.local/lib/"
          cp -r templates/ "$HOME/.local/templates/"
          cp bin/nsf       "$HOME/.local/bin/nsf"
          chmod +x         "$HOME/.local/bin/nsf"

      - name: Smoke test
        run: |
          export NSF_INSTALL_DIR="$HOME/.local"
          bash "$HOME/.local/bin/nsf" --version
          bash "$HOME/.local/bin/nsf" --help
          bash "$HOME/.local/bin/nsf" --list

      - name: Run full test suite
        run: |
          export NSF_INSTALL_DIR="$HOME/.local"
          /opt/homebrew/bin/bash tests/test_nsf.sh

  changelog:
    name: Changelog updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG updated when code changes
        run: |
          changed_code=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^(bin/|lib/|templates/)' || true)

          if [[ -n "${changed_code}" ]]; then
            changed_changelog=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep 'CHANGELOG.md' || true)

            if [[ -z "${changed_changelog}" ]]; then
              echo "Code files changed but CHANGELOG.md was not updated."
              echo "Changed files:"
              echo "${changed_code}"
              echo ""
              echo "Please add an entry to CHANGELOG.md under [Unreleased]."
              exit 1
            fi
          fi
