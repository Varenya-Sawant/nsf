# =============================================================================
# nsf.conf — User configuration for nsf
#
# Location: ~/.config/nsf/nsf.conf
# Copy this file there with:
#   mkdir -p ~/.config/nsf && cp config/nsf.conf ~/.config/nsf/
#
# How values are resolved (highest priority first):
#   1. Environment variable set before running nsf  (NSF_AUTHOR="X" nsf file.py)
#   2. This config file
#   3. Built-in defaults in lib/constants.sh
#
# Uncomment a line to activate it. Lines starting with # are ignored.
# =============================================================================

# -----------------------------------------------------------------------------
# Identity
# -----------------------------------------------------------------------------

# Your name — injected as {{NSF_AUTHOR}} in every generated file
# NSF_AUTHOR="YOUR_NAME"

# License identifier — injected as {{NSF_LICENSE}} in every generated file
# Common values: MIT, Apache-2.0, GPL-3.0, BSD-2-Clause, UNLICENSED
# NSF_LICENSE="MIT"

# Default description — injected as {{NSF_DESCRIPTION}} unless --desc is used
# Leave empty to have a blank description field in generated files
# NSF_DESCRIPTION=""

# -----------------------------------------------------------------------------
# Formatting
# -----------------------------------------------------------------------------

# Date format used in file headers — uses strftime syntax
# %Y-%m-%d = 2025-01-15   %d/%m/%Y = 15/01/2025   %B %d, %Y = January 15, 2025
# NSF_DATE_FORMAT="%Y-%m-%d"

# -----------------------------------------------------------------------------
# Editor
# -----------------------------------------------------------------------------

# Editor to offer after file creation (1=Vim 2=Nano in the prompt)
# This sets the fallback if the user picks an option not in the prompt.
# NSF_EDITOR="vim"

# Set to false to skip the editor prompt entirely
# ENABLE_EDITOR_SELECTION="true"

# Seconds to wait for editor choice before auto-skipping
# Useful when nsf is called from scripts that shouldn't hang
# TIMEOUT_SECONDS="5"

# -----------------------------------------------------------------------------
# Post-creation behaviour
# -----------------------------------------------------------------------------

# Automatically run chmod +x on script files (sh, bash, py, rb, php, js)
# Set to false if you manage permissions yourself
# DEFAULT_MAKE_EXECUTABLE="true"

# Automatically run git add on newly created files when inside a git repo
# Set to false if you prefer to stage files manually
# ENABLE_GIT_INTEGRATION="true"

# -----------------------------------------------------------------------------
# Debug
# -----------------------------------------------------------------------------

# Print verbose internal information during file creation
# Useful when troubleshooting template loading or config issues
# NSF_DEBUG="false"
