# NSF Configuration File
# Location: ~/.config/nsf/nsf.conf
# Edit this file to customize NSF behavior

# Author information (injected into scripts)
NSF_AUTHOR="${NSF_AUTHOR:-Your Name}"
NSF_EMAIL="${NSF_EMAIL:-your.email@example.com}"

# Date format for metadata
# Supported formats: %Y-%m-%d, %d/%m/%Y, YYYY-MM-DD
NSF_DATE_FORMAT="%Y-%m-%d"

# Default text editor for opening files
# Options: vim, nano, emacs, code, gedit
# Leave blank to open script without editor
NSF_EDITOR="nano"

# Debug mode (show verbose output)
# Set to 1 to enable, 0 to disable
NSF_DEBUG="${NSF_DEBUG:-0}"

# Color output in terminal
# Set to 1 for colors, 0 for plain text
NSF_USE_COLORS="${NSF_USE_COLORS:-1}"

# Make scripts executable immediately after creation
# Set to 1 to auto-chmod +x, 0 to skip
NSF_AUTO_EXECUTABLE="${NSF_AUTO_EXECUTABLE:-1}"

# Log file location (optional)
# Leave blank to disable logging
NSF_LOG_FILE="${NSF_LOG_FILE:-}"

# Default language for templates
# If not specified explicitly: sh (bash), py (python), js (javascript), etc.
NSF_DEFAULT_LANGUAGE="sh"

# Backup original files before overwriting
# Set to 1 to create .bak, 0 to overwrite
NSF_CREATE_BACKUP="${NSF_CREATE_BACKUP:-1}"

# Custom template directory (optional)
# Leave blank to use built-in templates
NSF_CUSTOM_TEMPLATES="${NSF_CUSTOM_TEMPLATES:-}"

# Suppress success messages
# Set to 1 for quiet mode, 0 for normal
NSF_QUIET_MODE="${NSF_QUIET_MODE:-0}"

# Timeout for user prompts (seconds)
NSF_PROMPT_TIMEOUT="${NSF_PROMPT_TIMEOUT:-30}"
